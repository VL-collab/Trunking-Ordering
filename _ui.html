<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="線槽訂貨">
<meta name="theme-color" content="#9d1c1c">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="線槽、托盤、梯架及地槽配件訂貨">
<title>線槽訂貨 · Trunking Ordering</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  --bg: #f4efe8;
  --ink: #1b1714;
  --muted: #6f675f;
  --line: #e4dcd2;
  --card: #fffdfb;
  --red: #b42318;
  --red-dark: #8c140c;
  --red-soft: #f8e8e4;
  --steel: #243140;
  --ok: #0f7a45;
  --shadow: 0 12px 32px rgba(48, 32, 18, .08);
  --top: env(safe-area-inset-top, 0px);
  --bot: env(safe-area-inset-bottom, 0px);
  --radius: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Segoe UI", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(1200px 400px at 10% -10%, #fff 0%, transparent 50%),
    var(--bg);
  min-height: 100dvh;
  font-size: 16px;
  line-height: 1.45;
}
button, input, select, textarea { font-family: inherit; font-size: 16px; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; display: block; }
.app { max-width: 1180px; margin: 0 auto; padding: 0 16px calc(112px + var(--bot)); }
.top {
  position: sticky; top: 0; z-index: 20;
  padding: calc(10px + var(--top)) 16px 10px;
  background: rgba(244, 239, 232, .92);
  backdrop-filter: saturate(1.2) blur(12px);
  border-bottom: 1px solid transparent;
}
.top.scrolled { border-bottom-color: var(--line); }
.top-inner { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; background: none; border: 0; padding: 0; text-align: left; }
.mark {
  width: 40px; height: 40px; border-radius: 12px; background: var(--red); color: #fff;
  display: grid; place-items: center; font-weight: 700; letter-spacing: .04em; flex: none;
}
.brand b { display: block; font-size: 16px; letter-spacing: .02em; }
.brand small { color: var(--muted); font-size: 12px; }
.search {
  flex: 1; display: flex; align-items: center; gap: 8px;
  background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; min-width: 0;
}
.search input { border: 0; outline: 0; width: 100%; background: transparent; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line);
  background: #fff; display: grid; place-items: center; position: relative; flex: none;
}
.badge {
  position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 999px; background: var(--red); color: #fff; font-size: 11px; line-height: 18px; font-weight: 700;
}
.cats { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.chip {
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  border-radius: 999px; padding: 8px 14px; white-space: nowrap; min-height: 40px;
}
.chip.active { background: var(--steel); color: #fff; border-color: var(--steel); }
.lead { display: flex; justify-content: space-between; gap: 12px; align-items: end; margin: 8px 0 14px; }
.lead h1 { font-size: 28px; line-height: 1.15; margin: 0; letter-spacing: -.02em; }
.lead p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.group-title { font-size: 14px; letter-spacing: .08em; text-transform: none; color: var(--muted); margin: 18px 0 10px; font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 0; text-align: left; overflow: hidden; box-shadow: 0 1px 0 rgba(255,255,255,.7) inset;
}
.thumb { background: #fff; aspect-ratio: 4 / 3; display: grid; place-items: center; border-bottom: 1px solid var(--line); }
.thumb img { width: 100%; height: 100%; object-fit: contain; }
.card-body { padding: 10px 12px 12px; }
.card-body b { display: block; font-size: 15px; line-height: 1.35; }
.card-body small { display: block; color: var(--muted); margin-top: 2px; font-size: 12px; }
.meta { display: inline-block; margin-top: 8px; font-size: 12px; color: var(--red-dark); background: var(--red-soft); border-radius: 999px; padding: 2px 8px; }
.detail { display: grid; gap: 16px; }
.hero-img { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 12px; }
.hero-img img { width: 100%; max-height: 360px; object-fit: contain; margin: 0 auto; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
.kicker { color: var(--red); font-size: 12px; font-weight: 700; letter-spacing: .06em; }
.detail h2 { margin: 4px 0 6px; font-size: 26px; letter-spacing: -.02em; }
.en { color: var(--muted); margin: 0 0 8px; }
.blurb { color: var(--steel); font-size: 14px; margin: 0 0 8px; }
.opt { margin-top: 14px; }
.opt .lab, .field-lab { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
.segs, .sizes { display: flex; flex-wrap: wrap; gap: 8px; }
.seg, .size {
  border: 1px solid var(--line); background: #fff; border-radius: 12px; min-height: 40px; padding: 8px 12px;
}
.seg.on, .size.on { border-color: var(--red); background: var(--red-soft); color: var(--red-dark); font-weight: 700; }
.dims { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.dim {
  background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center;
}
.dim.changed { border-color: #d97706; background: #fff8ee; }
.dim b { font-size: 18px; color: var(--steel); }
.dim input, .textin, .qty input {
  width: 100%; border: 0; outline: 0; background: transparent; padding: 6px 0; min-height: 36px;
}
.dim span { color: var(--muted); font-size: 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.textin, textarea, .qty {
  width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 12px;
}
textarea { min-height: 88px; resize: vertical; }
.qty { display: flex; align-items: center; gap: 8px; padding: 6px; }
.qty button {
  width: 44px; height: 44px; border: 0; border-radius: 10px; background: var(--steel); color: #fff; font-size: 22px;
}
.qty input { text-align: center; font-weight: 700; }
.model-box {
  margin-top: 12px; background: var(--steel); color: #fff; border-radius: 14px; padding: 12px 14px;
}
.model-box span { display: block; font-size: 12px; opacity: .75; }
.model-box input { width: 100%; border: 0; background: transparent; color: #fff; font-weight: 700; font-size: 18px; outline: 0; padding: 2px 0; }
.hint { color: #f2c9a0; font-size: 12px; margin-top: 4px; }
.actions { display: flex; gap: 8px; margin-top: 14px; }
.btn {
  min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: #fff; padding: 0 16px; font-weight: 700;
}
.btn.solid { background: var(--red); color: #fff; border-color: var(--red); flex: 1; }
.btn.ghost { background: #fff; }
.btn.steel { background: var(--steel); color: #fff; border-color: var(--steel); }
.btn:disabled { opacity: .45; }
.cart-item {
  display: grid; grid-template-columns: 92px 1fr; gap: 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px; margin-bottom: 10px;
}
.cart-item img { width: 92px; height: 92px; object-fit: contain; background: #fff; border-radius: 12px; border: 1px solid var(--line); }
.cart-item h3 { margin: 0 0 2px; font-size: 16px; }
.specs { margin: 6px 0; padding: 0; list-style: none; color: var(--steel); font-size: 13px; }
.specs li { margin: 1px 0; }
.item-tools { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.step { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; background: #fff; overflow: hidden; }
.step button { width: 40px; height: 40px; border: 0; background: #f6f2ec; font-size: 20px; }
.step input { width: 52px; border: 0; text-align: center; font-weight: 700; height: 40px; }
.trash { width: 40px; height: 40px; border-radius: 12px; border: 1px solid #f0c9c4; background: #fff; color: var(--red); }
.project { display: grid; gap: 8px; }
.project label { display: grid; gap: 4px; font-size: 13px; font-weight: 700; }
.export-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.wide { grid-column: 1 / -1; }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  padding: 8px 16px calc(8px + var(--bot));
  background: rgba(255, 253, 251, .94); border-top: 1px solid var(--line);
  backdrop-filter: blur(12px);
}
.tab {
  min-height: 48px; border-radius: 14px; border: 0; background: transparent; font-weight: 700; color: var(--muted);
}
.tab.on { background: var(--steel); color: #fff; }
.toast {
  position: fixed; left: 50%; bottom: calc(78px + var(--bot)); transform: translateX(-50%) translateY(12px);
  background: var(--steel); color: #fff; border-radius: 999px; padding: 10px 14px 10px 16px;
  display: flex; align-items: center; gap: 10px; opacity: 0; pointer-events: none; transition: .2s ease; z-index: 40;
  max-width: calc(100% - 24px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast button { border: 0; background: #fff; color: var(--steel); border-radius: 999px; min-height: 32px; padding: 0 10px; font-weight: 700; }
.mask {
  position: fixed; inset: 0; background: rgba(28, 23, 18, .45); z-index: 50;
  display: none; align-items: end; justify-content: center; padding: 16px;
}
.mask.show { display: flex; }
.sheet { width: min(440px, 100%); background: #fff; border-radius: 20px; padding: 18px; margin-bottom: calc(8px + var(--bot)); }
.sheet h3 { margin: 0 0 8px; }
.sheet p { margin: 0 0 14px; color: var(--muted); }
.sheet .actions { margin-top: 0; }
.foot { color: var(--muted); font-size: 12px; margin: 22px 0 8px; }
@media (min-width: 760px) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .dims { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .detail { grid-template-columns: minmax(280px, .9fr) 1.1fr; align-items: start; }
  .hero-img { position: sticky; top: calc(78px + var(--top)); }
  .export-bar { grid-template-columns: repeat(4, 1fr); }
  .wide { grid-column: auto; }
  .mask { align-items: center; }
}
@media (min-width: 1080px) {
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .lead h1 { font-size: 34px; }
}
@media (hover: hover) {
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .card { transition: .15s ease; }
}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="top-inner">
    <button class="brand" id="homeBtn" type="button">
      <span class="mark">訂</span>
      <span><b>線槽訂貨</b><small>Trunking Ordering</small></span>
    </button>
    <label class="search" id="searchWrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6f675f" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜尋配件、型號、尺寸" enterkeyhint="search" autocomplete="off">
    </label>
    <button class="icon-btn" id="cartBtn" type="button" aria-label="購物籃">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
      <span class="badge" id="badge" hidden>0</span>
    </button>
  </div>
  <div class="cats" id="cats"></div>
</header>
<main class="app" id="main"></main>
<nav class="tabbar">
  <button class="tab on" id="tabShop" type="button">選購</button>
  <button class="tab" id="tabCart" type="button">購物籃</button>
</nav>
<div class="toast" id="toast"><span id="toastMsg"></span><button type="button" id="toastGo">查看</button></div>
<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<script id="catalog" type="application/json">__CATALOG_JSON__</script>
<script>
const CATALOG = JSON.parse(document.getElementById("catalog").textContent);
const byId = Object.fromEntries(CATALOG.products.map(p => [p.id, p]));
const catById = Object.fromEntries(CATALOG.categories.map(c => [c.id, c]));
const KEY = "lh-trunking-order-v1";

const state = {
  view: "shop",
  cat: "all",
  q: "",
  productId: null,
  draft: null,
  project: { name: "", jobNo: "", po: "", customer: "", contact: "", phone: "", date: today(), delivery: "", remarks: "" },
  items: []
};

function today() {
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.project) state.project = { ...state.project, ...data.project };
    if (Array.isArray(data.items)) state.items = data.items;
  } catch (e) {}
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ project: state.project, items: state.items }));
  } catch (e) {
    toast("此裝置儲存空間不足，請先匯出專檔");
  }
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function qtyOf() { return state.items.reduce((n, it) => n + Number(it.qty || 0), 0); }

function choice(product, key, id) {
  const opt = (product.options || []).find(o => o.key === key);
  if (!opt) return null;
  return opt.choices.find(c => c.id === id) || null;
}
function modelFor(product, size, options) {
  if (!size) return "";
  let code = size.code;
  if (code && typeof code === "object") code = code[options[product.mapKey]] ?? "";
  let model = code || "";
  if (product.prefixKey) model = (options[product.prefixKey] || "") + model;
  if (product.finishSuffix && options.finish) model += options.finish;
  if (product.compSuffix && options.comp) model += options.comp;
  return model;
}
function presetDims(size) {
  const out = {};
  Object.entries(size.dims || {}).forEach(([k, v]) => { out[k] = String(v); });
  return out;
}
function makeDraft(product) {
  const options = {};
  (product.options || []).forEach(opt => { options[opt.key] = opt.choices[0].id; });
  const size = product.sizes[0];
  return {
    options,
    sizeId: size.id,
    dims: presetDims(size),
    model: modelFor(product, size, options),
    length: product.length != null ? String(product.length) : "",
    notes: "",
    qty: 1,
    customFit: ""
  };
}
function currentSize(product, draft) {
  if (draft.sizeId === "custom") return null;
  return product.sizes.find(s => s.id === draft.sizeId) || null;
}
function dimsChanged(product, draft) {
  if (draft.sizeId === "custom") return true;
  const size = currentSize(product, draft);
  if (!size) return false;
  return (product.edges || []).some(edge => String(draft.dims[edge] ?? "") !== String(size.dims[edge] ?? ""));
}
function optionLines(product, options) {
  const lines = [];
  (product.options || []).forEach(opt => {
    const ch = choice(product, opt.key, options[opt.key]);
    if (ch) lines.push(opt.label + " " + ch.label);
  });
  return lines;
}
function describe(item) {
  const lines = [];
  lines.push("型號 " + (item.model || "—"));
  if (item.fit) lines.push("適用 " + item.fit + " mm");
  (item.edges || []).forEach(edge => {
    const v = item.dims?.[edge];
    if (v !== undefined && v !== "") lines.push(edge + " " + v + " mm");
  });
  if (item.length) lines.push("長度 " + item.length + " m");
  optionLines(byId[item.productId] || { options: [] }, item.options || []).forEach(l => lines.push(l));
  if (!byId[item.productId] && item.optionText) item.optionText.forEach(l => lines.push(l));
  if (item.edited) lines.push("邊長已按要求修改");
  return lines;
}
function sortedItems() {
  const order = CATALOG.categories.map(c => c.id);
  return state.items.map((it, i) => ({ it, i })).sort((a, b) => {
    const d = order.indexOf(a.it.cat) - order.indexOf(b.it.cat);
    if (d) return d;
    return String(a.it.zh).localeCompare(String(b.it.zh), "zh-Hant") || a.i - b.i;
  }).map(x => x.it);
}
function grouped() {
  const groups = [];
  sortedItems().forEach(it => {
    let g = groups.find(x => x.id === it.cat);
    if (!g) {
      const c = catById[it.cat] || { id: it.cat, zh: it.catName || it.cat, en: "" };
      g = { id: c.id, zh: c.zh, en: c.en, items: [] };
      groups.push(g);
    }
    g.items.push(it);
  });
  return groups;
}

function renderCats() {
  const el = document.getElementById("cats");
  const cats = [{ id: "all", zh: "全部" }].concat(CATALOG.categories);
  el.innerHTML = cats.map(c => `<button type="button" class="chip${state.cat === c.id ? " active" : ""}" data-cat="${esc(c.id)}">${esc(c.zh)}</button>`).join("");
  el.querySelectorAll("[data-cat]").forEach(btn => btn.onclick = () => {
    state.cat = btn.dataset.cat;
    state.view = "shop";
    state.q = "";
    document.getElementById("q").value = "";
    render();
  });
}
function renderBadge() {
  const n = state.items.length;
  const b = document.getElementById("badge");
  b.hidden = n <= 0;
  b.textContent = String(n);
  document.getElementById("tabShop").classList.toggle("on", state.view !== "cart");
  document.getElementById("tabCart").classList.toggle("on", state.view === "cart");
  document.getElementById("cats").style.display = state.view === "shop" ? "" : "none";
  document.getElementById("searchWrap").style.display = state.view === "shop" ? "" : "none";
}
function matchProduct(p, q) {
  const blob = [p.zh, p.en, p.group, p.blurb, ...(p.sizes || []).map(s => s.label + " " + (typeof s.code === "string" ? s.code : Object.values(s.code || {}).join(" ")))].join(" ").toLowerCase();
  return q.split(/\s+/).every(part => blob.includes(part));
}
function visibleProducts() {
  const q = state.q.trim().toLowerCase();
  let list = CATALOG.products;
  if (!q && state.cat !== "all") list = list.filter(p => p.cat === state.cat);
  if (q) list = CATALOG.products.filter(p => matchProduct(p, q) && (state.cat === "all" || p.cat === state.cat));
  return list;
}
function renderShop() {
  const cat = state.cat === "all" ? null : catById[state.cat];
  const list = visibleProducts();
  const title = state.q ? "搜尋結果" : (cat ? cat.zh : "選擇分類");
  const sub = state.q ? `「${state.q}」共 ${list.length} 項` : (cat ? cat.en + " · " + list.length + " 項配件" : "先選大分類，再點配件圖設定尺寸");
  let html = `<div class="lead"><div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div></div>`;
  if (!state.q && state.cat === "all") {
    html += `<div class="grid">${CATALOG.categories.map(c => {
      const n = CATALOG.products.filter(p => p.cat === c.id).length;
      return `<button type="button" class="card" data-catpick="${esc(c.id)}"><div class="thumb" style="aspect-ratio:16/9;background:var(--steel);color:#fff"><b style="font-size:22px;padding:16px">${esc(c.zh)}</b></div><div class="card-body"><b>${esc(c.zh)}</b><small>${esc(c.en)}</small><span class="meta">${n} 項配件</span></div></button>`;
    }).join("")}</div>`;
  } else if (!list.length) {
    html += `<div class="empty">找不到相符配件</div>`;
  } else if (state.q) {
    html += `<div class="grid">${list.map(cardHtml).join("")}</div>`;
  } else {
    const groups = [];
    list.forEach(p => {
      let g = groups.find(x => x.name === p.group);
      if (!g) { g = { name: p.group, items: [] }; groups.push(g); }
      g.items.push(p);
    });
    groups.forEach(g => {
      html += `<div class="group-title">${esc(g.name)}</div><div class="grid">${g.items.map(cardHtml).join("")}</div>`;
    });
  }
  html += `<p class="foot">尺寸依照 Trunking 2021 / 25v2 目錄。標準尺寸可改，亦可輸入自訂尺寸。iPhone / iPad 可用「分享 → 加入主畫面」。</p>`;
  document.getElementById("main").innerHTML = html;

const CRC_TABLE = (() => {

async function zipFiles(files) {

    const raw = f.data;
    const comp = await deflateRaw(raw);
    const crc = crc32(raw);
    const local = concat([
      u32(0x04034b50), u16(20), u16(0), u16(8), u16(0), u16(0),
      u32(crc), u32(comp.length), u32(raw.length), u16(name.length), u16(0), name, comp

    const central = concat([
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(8), u16(0), u16(0),
      u32(crc), u32(comp.length), u32(raw.length), u16(name.length), u16(0), u16(0),
      u16(0), u16(0), u32(0), u32(offset), name

    centrals.push(central);

    u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),

}
function itemParagraphs(it) {
  const lines = [it.zh, it.en].concat(describe(it));
  if (it.notes) lines.push("噴粉 / 備註 " + it.notes);
  lines.push("數量 " + it.qty + " " + (it.unit || "件"));
  return lines;
}

          const sz = jpegSize(bytes);
          const cx = 1050000;

          drawing = drawingXml(pic, rid, cx, cy);

        }
        const detail = itemParagraphs(it).filter(l => !l.startsWith("數量") && !l.startsWith("噴粉")).map(l => pText(l, { size: 18 })).join("");
        rows.push(tr([

        <w:top w:val="single" w:sz="4" w:color="E4DCD2"/>

<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><w:body>${body.join("")}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720" w:header="200" w:footer="200" w:gutter="0"/></w:sectPr></w:body></w:document>`;
    const files = [
      { name: "[Content_Types].xml", data: enc(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Default Extension="jpg" ContentType="image/jpeg"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`) },
      { name: "_rels/.rels", data: enc(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`) },
      { name: "word/document.xml", data: enc(documentXml) },
      { name: "word/_rels/document.xml.rels", data: enc(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join("")}</Relationships>`) }

}
function enc(s) { return new TextEncoder().encode(s); }
function pText(text, opt = {}) {
  const rPr = `<w:rPr>${opt.bold ? "<w:b/>" : ""}<w:sz w:val="${opt.size || 21}"/><w:szCs w:val="${opt.size || 21}"/>${opt.color ? `<w:color w:val="${opt.color}"/>` : ""}<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Microsoft JhengHei"/></w:rPr>`;
  const pPr = opt.fill ? `<w:pPr><w:shd w:val="clear" w:color="auto" w:fill="${opt.fill}"/></w:pPr>` : "";
  return `<w:p>${pPr}<w:r>${rPr}<w:t xml:space="preserve">${xmlEscape(text)}</w:t></w:r></w:p>`;
}
function projectTable() {
  const rows = projectFields().map(([k, v]) => `<w:tr><w:trPr><w:trHeight w:val="300" w:hRule="atLeast"/></w:trPr>${tc(k, { w: 3200, bold: true })}${tc(v || " ", { w: 7700 })}</w:tr>`).join("");
  return `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>
        <w:top w:val="single" w:sz="4" w:color="E4DCD2"/>
        <w:left w:val="single" w:sz="4" w:color="E4DCD2"/>
        <w:bottom w:val="single" w:sz="4" w:color="E4DCD2"/>
        <w:right w:val="single" w:sz="4" w:color="E4DCD2"/>
        <w:insideH w:val="single" w:sz="4" w:color="E4DCD2"/>
        <w:insideV w:val="single" w:sz="4" w:color="E4DCD2"/>
      </w:tblBorders></w:tblPr>${rows}</w:tbl>`;
}
function tc(content, opt = {}) {
  const inner = opt.raw ? content : pText(content, { size: 18, bold: !!(opt.header || opt.bold), color: opt.header ? "FFFFFF" : "" });
  const shd = opt.header ? `<w:shd w:val="clear" w:color="auto" w:fill="243140"/>` : "";
  const align = opt.center ? `<w:vAlign w:val="center"/>` : `<w:vAlign w:val="center"/>`;
  return `<w:tc><w:tcPr><w:tcW w:w="${opt.w || 2000}" w:type="dxa"/>${shd}${align}</w:tcPr>${inner}</w:tc>`;
}
function tr(cells, header) {
  return `<w:tr>${header ? `<w:trPr><w:tblHeader/></w:trPr>` : `<w:trPr><w:trHeight w:val="900" w:hRule="atLeast"/></w:trPr>`}${cells.join("")}</w:tr>`;
}
function drawingXml(id, rid, cx, cy) {
  return `<w:p><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="${id}" name="Picture ${id}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${id}" name="img${id}.jpg"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
}

function colName(n) {
  let s = "";
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
